name: Build signed Workforce Hub Lite APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKFORCE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workforce-hub-lite.jks"
      - name: Build permanently signed APK
        working-directory: android
        env:
          WORKFORCE_KEYSTORE_PATH: ${{ runner.temp }}/workforce-hub-lite.jks
          WORKFORCE_KEYSTORE_PASSWORD: ${{ secrets.WORKFORCE_KEYSTORE_PASSWORD }}
          WORKFORCE_KEY_PASSWORD: ${{ secrets.WORKFORCE_KEY_PASSWORD }}
          WORKFORCE_KEY_ALIAS: workforce-hub-lite
        run: ./gradlew assembleRelease
      - name: Prepare release file
        run: cp android/app/build/outputs/apk/release/app-release.apk Workforce-Hub-Lite.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Workforce-Hub-Lite.apk --title "Workforce Hub Lite Android" --notes "Permanently signed Android release. Future releases using the same signing key install as updates."
